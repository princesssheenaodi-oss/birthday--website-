<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Allie ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"DM Sans",sans-serif;
    background:
        radial-gradient(circle at 15% 15%,rgba(255,255,255,.12) 0 2px,transparent 3px),
        radial-gradient(circle at 80% 30%,rgba(255,120,150,.15) 0 3px,transparent 4px),
        linear-gradient(135deg,#35000e,#720019,#b00032,#4a0014);
    background-size:160px 160px,220px 220px,100% 100%;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

button{
    font-family:inherit;
}

.particle{
    position:fixed;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#ff8797;
    opacity:.55;
    pointer-events:none;
    animation:float 8s infinite ease-in-out;
    z-index:0;
}

.p1{left:8%;top:20%}
.p2{left:20%;top:70%;animation-delay:2s}
.p3{left:70%;top:15%;animation-delay:4s}
.p4{left:90%;top:60%;animation-delay:1s}
.p5{left:45%;top:35%;animation-delay:3s}

@keyframes float{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-35px) scale(1.5)}
}

/* NAV */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:100;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(35,0,10,.78);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.15);
}

.logo{
    font-weight:700;
    letter-spacing:1px;
}

.navlinks{
    display:flex;
    gap:8px;
}

.navlinks button{
    border:0;
    background:transparent;
    color:white;
    padding:8px 12px;
    border-radius:20px;
    cursor:pointer;
}

.navlinks button:hover{
    background:#e63955;
}

/* SECTIONS */

section{
    min-height:100vh;
    padding:110px 7%;
    display:none;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:1;
}

section.active{
    display:flex;
    animation:appear .7s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(25px)
    }
    to{
        opacity:1;
        transform:translateY(0)
    }
}

/* CARD */

.card{
    width:min(1000px,100%);
    background:rgba(55,0,15,.78);
    border:1px solid rgba(255,180,190,.3);
    border-radius:30px;
    padding:45px;
    box-shadow:
        0 25px 80px rgba(20,0,5,.55),
        inset 0 0 40px rgba(255,70,100,.08);
    backdrop-filter:blur(14px);
}

h1,h2{
    font-family:"Playfair Display",serif;
}

h1{
    font-size:clamp(3rem,7vw,6rem);
    line-height:1;
}

h2{
    font-size:clamp(2rem,5vw,3.5rem);
    margin-bottom:20px;
}

h3{
    color:#fff;
}

p{
    line-height:1.8;
    color:#ffe9ed;
}

/* BUTTON */

.main-btn{
    margin-top:25px;
    padding:15px 25px;
    border:0;
    border-radius:30px;
    background:linear-gradient(135deg,#ff5573,#c91540);
    color:white;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 0 #650018;
    transition:.25s;
}

.main-btn:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 0 #650018;
}

.main-btn:active{
    transform:translateY(3px);
    box-shadow:0 4px 0 #650018;
}

/* PASSWORD */

#passwordPage{
    text-align:center;
}

.password-box{
    max-width:520px;
    margin:auto;
    padding:50px 35px;
    background:
        linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02)),
        rgba(50,0,14,.9);
}

.password-cat{
    width:150px;
    height:150px;
    margin:0 auto 20px;
    display:block;
    animation:catFloat 3s ease-in-out infinite;
    filter:drop-shadow(0 15px 15px rgba(0,0,0,.4));
}

@keyframes catFloat{
    0%,100%{
        transform:translateY(0) rotate(-2deg)
    }
    50%{
        transform:translateY(-12px) rotate(2deg)
    }
}

.lock{
    font-size:1.2rem;
    margin-bottom:10px;
    color:#ff9aaa;
    letter-spacing:2px;
}

.password-box h2{
    margin-bottom:12px;
}

.password-input{
    width:100%;
    padding:16px 20px;
    margin-top:20px;
    border:2px solid #ff6078;
    border-radius:30px;
    background:#29000b;
    color:white;
    outline:none;
    text-align:center;
    font-size:1.1rem;
}

.password-input:focus{
    border-color:#ff9aaa;
    box-shadow:0 0 20px rgba(255,70,100,.2);
}

.password-input::placeholder{
    color:#ffb6c0;
}

.hint{
    margin-top:12px;
    font-size:.9rem;
    color:#ffb5c0;
}

.error{
    margin-top:12px;
    color:#ff9aaa;
    display:none;
}

/* CAT */

.cat-svg{
    display:block;
    width:100%;
    height:100%;
}

/* OPENING */

#opening{
    text-align:center;
}

.opening-cat{
    width:230px;
    height:230px;
    object-fit:contain;
    animation:breathe 3s infinite ease-in-out;
    filter:drop-shadow(0 15px 20px rgba(30,0,10,.5));
}

@keyframes breathe{
    0%,100%{
        transform:translateY(0) rotate(-2deg)
    }
    50%{
        transform:translateY(-12px) rotate(2deg)
    }
}

.small{
    margin-top:15px;
    color:#ffb5c0;
}

/* HOME */

.home-content{
    text-align:center;
}

.home-cat{
    width:190px;
    height:190px;
    object-fit:contain;
    margin-bottom:10px;
    animation:wiggle 4s infinite;
}

@keyframes wiggle{
    0%,90%,100%{
        transform:rotate(0)
    }
    93%{
        transform:rotate(-5deg)
    }
    96%{
        transform:rotate(5deg)
    }
}

/* FLOWER */

.flower-area{
    margin:30px auto;
    height:190px;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.emoji-bouquet{
    font-size:125px;
    line-height:1;
    display:inline-block;
    animation:bouquetFloat 3s infinite ease-in-out;
    filter:drop-shadow(0 12px 12px rgba(40,0,10,.4));
}

@keyframes bouquetFloat{
    0%,100%{
        transform:translateY(0) rotate(-2deg)
    }
    50%{
        transform:translateY(-10px) rotate(2deg)
    }
}

/* MENU */

.menu{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
    margin-top:35px;
}

.menu-card{
    padding:20px 12px;
    border-radius:22px;
    background:linear-gradient(145deg,#b4002d,#750019);
    border:1px solid rgba(255,180,190,.2);
    cursor:pointer;
    transition:.3s;
    text-align:center;
}

.menu-card:hover{
    transform:translateY(-10px) rotate(-1deg);
    background:linear-gradient(145deg,#e52b4e,#8e0020);
    box-shadow:0 15px 30px rgba(30,0,10,.35);
}

.menu-card h3{
    margin-top:10px;
}

.menu-card p{
    font-size:.8rem;
    color:#ffc6ce;
}

.choice-cat{
    width:90px;
    height:90px;
    display:block;
    margin:0 auto;
}

/* LETTER */

.letter{
    background:#fff0f3;
    color:#48000f;
    padding:40px;
    border-radius:18px;
    position:relative;
}

.letter p{
    color:#4c111c;
    margin-bottom:17px;
}

.letter h2{
    color:#970020;
}

.letter-cat{
    position:absolute;
    right:20px;
    top:-100px;
    width:140px;
    height:140px;
    object-fit:contain;
    animation:floatCat 4s infinite ease-in-out;
}

@keyframes floatCat{
    0%,100%{
        transform:translateY(0) rotate(3deg)
    }
    50%{
        transform:translateY(-12px) rotate(-3deg)
    }
}

.signature{
    font-weight:700;
    color:#a30025 !important;
}

/* MUSIC */

.music{
    text-align:center;
}

.music-cat{
    width:170px;
    height:170px;
    object-fit:contain;
    animation:musicBounce .8s infinite alternate;
}

@keyframes musicBounce{
    from{transform:translateY(0)}
    to{transform:translateY(-12px) rotate(2deg)}
}

.song-box{
    margin:30px auto;
    max-width:650px;
    padding:30px;
    border-radius:25px;
    background:linear-gradient(135deg,#690016,#b50031,#e83255);
    border:1px solid rgba(255,255,255,.2);
}

.song-title{
    font-size:1.5rem;
    font-weight:700;
}

.lyrics{
    margin-top:25px;
    padding:20px;
    border-left:3px solid #ff637b;
    color:#ffd9df;
    line-height:2;
    opacity:0;
    transform:translateY(20px);
    transition:.7s;
}

.lyrics.show{
    opacity:1;
    transform:translateY(0);
}

/* THOUGHTS */

.thoughts{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:30px;
}

.thought{
    min-height:180px;
    padding:25px;
    border-radius:20px;
    background:linear-gradient(145deg,#d21942,#87001f);
    display:flex;
    flex-direction:column;
    justify-content:center;
    transition:.3s;
    text-align:center;
}

.thought:hover{
    transform:scale(1.04) rotate(1deg);
}

.thought p{
    color:white;
}

.thought-cat{
    width:80px;
    height:80px;
    object-fit:contain;
    margin:0 auto 10px;
}

/* ANIMATION */

.animation-page{
    text-align:center;
    overflow:hidden;
}

.birthday-scene{
    position:relative;
    min-height:500px;
    margin-top:15px;
    border-radius:30px;
    background:
        radial-gradient(circle at 20% 15%,#ff7187 0 4px,transparent 5px),
        radial-gradient(circle at 80% 20%,#ff9aaa 0 4px,transparent 5px),
        linear-gradient(180deg,#a90029,#650014);
    overflow:hidden;
    border:2px solid rgba(255,180,190,.25);
    box-shadow:inset 0 0 60px rgba(255,40,80,.2);
}

/* BALLOONS */

.balloon{
    position:absolute;
    width:55px;
    height:68px;
    border-radius:50% 50% 45% 45%;
    background:#ff4564;
    animation:balloonFloat 3s infinite ease-in-out;
}

.balloon:after{
    content:"";
    position:absolute;
    width:1px;
    height:90px;
    background:#ffbdc7;
    left:50%;
    top:65px;
}

.balloon1{
    left:8%;
    top:40px;
}

.balloon2{
    right:10%;
    top:65px;
    background:#d51c43;
    animation-delay:.7s;
}

.balloon3{
    left:18%;
    top:150px;
    background:#ff6a80;
    animation-delay:1.2s;
}

.balloon4{
    right:20%;
    top:150px;
    background:#b9002e;
    animation-delay:1.7s;
}

@keyframes balloonFloat{
    0%,100%{
        transform:translateY(0) rotate(-3deg)
    }
    50%{
        transform:translateY(-15px) rotate(3deg)
    }
}

/* CONFETTI */

.confetti{
    position:absolute;
    width:9px;
    height:20px;
    background:#ff91a2;
    animation:confettiFall 4s infinite linear;
}

.c1{left:30%;top:-20px;animation-delay:.2s}
.c2{left:45%;top:-30px;animation-delay:1s}
.c3{left:60%;top:-15px;animation-delay:1.8s}
.c4{left:75%;top:-40px;animation-delay:2.5s}
.c5{left:90%;top:-20px;animation-delay:3s}

@keyframes confettiFall{
    from{transform:translateY(0) rotate(0)}
    to{transform:translateY(550px) rotate(360deg)}
}

/* PARTY CATS */

.party-cats{
    position:absolute;
    bottom:35px;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:20px;
}

.party-cat{
    width:115px;
    height:115px;
    object-fit:contain;
    animation:catDance .8s infinite alternate ease-in-out;
}

.party-cat:nth-child(2){animation-delay:.2s}
.party-cat:nth-child(3){animation-delay:.4s}

.bouquet-cat{
    width:150px;
    height:150px;
    position:absolute;
    left:50%;
    bottom:115px;
    transform:translateX(-50%);
    animation:catCelebrate 1s infinite alternate ease-in-out;
    z-index:5;
}

@keyframes catCelebrate{
    from{
        transform:translateX(-50%) translateY(0) rotate(-3deg)
    }
    to{
        transform:translateX(-50%) translateY(-10px) rotate(3deg)
    }
}

@keyframes catDance{
    from{transform:translateY(0) rotate(-3deg)}
    to{transform:translateY(-12px) rotate(3deg)}
}

/* CAKE */

.cake{
    position:absolute;
    left:50%;
    bottom:50px;
    transform:translateX(-50%);
    width:150px;
    height:85px;
    background:#ffb5c1;
    border-radius:15px 15px 25px 25px;
    border-bottom:15px solid #ff4564;
    z-index:4;
}

.cake:before{
    content:"";
    position:absolute;
    top:-35px;
    left:15px;
    width:120px;
    height:45px;
    background:#fff0f3;
    border-radius:50%;
    box-shadow:0 10px 0 #ff8fa0;
}

.candle{
    position:absolute;
    width:8px;
    height:35px;
    background:#ff4564;
    top:-62px;
    z-index:6;
}

.candle1{left:38px}
.candle2{left:70px}
.candle3{left:102px}

.flame{
    position:absolute;
    width:14px;
    height:20px;
    background:#ffd0d6;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    top:-20px;
    left:-3px;
    animation:flame .5s infinite alternate;
}

@keyframes flame{
    from{transform:rotate(-45deg) scale(1)}
    to{transform:rotate(-40deg) scale(1.15)}
}

.birthday-text{
    position:absolute;
    top:35px;
    width:100%;
    text-align:center;
    z-index:10;
}

.birthday-text h2{
    color:white;
    text-shadow:0 4px 10px rgba(50,0,10,.5);
}

.birthday-text p{
    color:#ffdce1;
}

/* FINAL */

.final{
    text-align:center;
}

.final-cat{
    width:220px;
    height:220px;
    object-fit:contain;
    animation:finalFloat 3s infinite ease-in-out;
}

@keyframes finalFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-15px)}
}

.final-flower{
    height:170px;
    margin:20px auto;
}

/* FLOWER DRAWING */

.bouquet{
    position:relative;
    width:180px;
    height:170px;
    margin:auto;
}

.stem{
    position:absolute;
    width:8px;
    height:130px;
    background:#8f172d;
    left:86px;
    top:35px;
    border-radius:10px;
}

.flower{
    position:absolute;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#ff4564;
    box-shadow:
        0 -15px 0 #ff4564,
        0 15px 0 #ff4564,
        -15px 0 0 #ff4564,
        15px 0 0 #ff4564;
}

.f1{left:68px;top:10px}
.f2{left:25px;top:35px;transform:scale(.75)}
.f3{left:110px;top:35px;transform:scale(.75)}
.f4{left:48px;top:65px;transform:scale(.65)}
.f5{left:92px;top:65px;transform:scale(.65)}

.ribbon{
    position:absolute;
    width:60px;
    height:25px;
    border:7px solid #ff91a2;
    border-radius:50%;
    left:60px;
    top:105px;
}

.labu{
    margin-top:35px;
    font-family:"Playfair Display",serif;
    font-size:3rem;
    color:#ff91a2;
    opacity:0;
    transform:scale(.7);
    transition:1s;
}

.labu.show{
    opacity:1;
    transform:scale(1);
}

/* BACK BUTTON */

.back-btn{
    background:#85001d;
    color:white;
    border:1px solid #ff7187;
    padding:12px 22px;
    border-radius:25px;
    cursor:pointer;
    margin-top:25px;
}

.back-btn:hover{
    background:#b0002c;
}

/* RESPONSIVE */

@media(max-width:1000px){
    .menu{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:800px){

    .navlinks{
        display:none;
    }

    .card{
        padding:28px 20px;
    }

    .menu{
        grid-template-columns:repeat(2,1fr);
    }

    .thoughts{
        grid-template-columns:1fr;
    }

    .letter-cat{
        position:relative;
        right:auto;
        top:auto;
        display:block;
        margin:0 auto 10px;
    }

    .party-cat{
        width:90px;
        height:90px;
    }

    .bouquet-cat{
        width:125px;
        height:125px;
    }
}

@media(max-width:500px){

    section{
        padding:100px 18px 50px;
    }

    h1{
        font-size:3rem;
    }

    .menu{
        grid-template-columns:1fr;
    }

    .opening-cat{
        width:180px;
        height:180px;
    }

    .emoji-bouquet{
        font-size:105px;
    }

    .birthday-scene{
        min-height:450px;
    }

    .party-cats{
        gap:2px;
    }

    .party-cat{
        width:80px;
        height:80px;
    }
}
</style>
</head>

<body>

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>

<nav>

    <div class="logo">
        FOR ALLIE ♡
    </div>

    <div class="navlinks">

        <button onclick="showPage('home')">Home</button>
        <button onclick="showPage('letterPage')">Letter</button>
        <button onclick="showPage('musicPage')">Song</button>
        <button onclick="showPage('thoughtPage')">Thoughts</button>
        <button onclick="showPage('animationPage')">Animation</button>
        <button onclick="showPage('finalPage')">Final</button>

    </div>

</nav>


<!-- PASSWORD -->

<section id="passwordPage" class="active">

<div class="card password-box">

<svg class="password-cat"
     viewBox="0 0 200 200"

    <path d="M100 155
             C75 142 64 157 82 169

             C103 166 110 174 118 169

          stroke-width="4"/>

</svg>

<div class="lock">♡ A LITTLE SECRET ♡</div>

<h2>Before you enter...</h2>

<p>
    This little birthday corner is locked.
</p>

<input
    id="passwordInput"
    class="password-input"
    type="password"
    placeholder="Enter the password"
    onkeydown="if(event.key==='Enter')checkPassword()"
>

</p>

<button class="main-btn" onclick="checkPassword()">
    UNLOCK ♡
</button>

</div>

</section>


<!-- OPENING -->

<section id="opening">

<div class="card" style="text-align:center;">

<svg class="opening-cat"
     viewBox="0 0 200 200"
     xmlns="http://www.w3.org/2000/svg">

    <path d="M38 78 L48 25 L82 58"
          fill="#ffb6c1"
          stroke="#650018"
          stroke-width="7"/>

    <path d="M162 78 L152 25 L118 58"
          fill="#ffb6c1"
          stroke="#650018"
          stroke-width="7"/>

    <ellipse cx="100" cy="105"
             rx="67" ry="58"
             fill="#fff0f3"
             stroke="#650018"
             stroke-width="7"/>

    <ellipse cx="76" cy="102"
             rx="7" ry="10"
             fill="#650018"/>

    <ellipse cx="124" cy="102"
             rx="7" ry="10"
             fill="#650018"/>

    <circle cx="78" cy="98" r="2.5" fill="white"/>
